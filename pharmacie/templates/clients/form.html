{% extends "base.html" %}
{% block titre %}{{ titre }}{% endblock %}
{% block titre_page %}{{ titre }}{% endblock %}
{% block contenu %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card">
      <div class="card-header">{{ titre }}</div>
      <div class="card-body">
        <form method="post" novalidate>
          {% csrf_token %}
          {% include "partials/form.html" %}
          <button class="btn btn-primary" type="submit">Enregistrer</button>
          <a class="btn btn-outline-secondary" href="{% if client %}{% url 'detail_client' client.pk %}{% else %}{% url 'liste_clients' %}{% endif %}">Annuler</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
