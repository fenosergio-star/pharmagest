{% extends "base.html" %}
{% block titre %}{{ titre }}{% endblock %}
{% block titre_page %}{{ titre }}{% endblock %}
{% block contenu %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card">
      <div class="card-header">{{ titre }}</div>
      <div class="card-body">
        <form method="post" enctype="multipart/form-data" novalidate>
          {% csrf_token %}
          {% include "partials/form.html" %}
          <button class="btn btn-primary" type="submit"><i class="bi bi-check-lg"></i> Enregistrer</button>
          <a class="btn btn-outline-secondary" href="{% if medicament %}{% url 'detail_medicament' medicament.pk %}{% else %}{% url 'liste_medicaments' %}{% endif %}">Annuler</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
