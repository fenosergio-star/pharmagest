{% extends "base.html" %}
{% load pharmagest %}
{% block titre %}Changement de mot de passe{% endblock %}
{% block titre_page %}Changement de mot de passe{% endblock %}
{% block contenu %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card">
      <div class="card-header">Modifier mon mot de passe</div>
      <div class="card-body">
        <form method="post" novalidate>
          {% csrf_token %}
          {% include "partials/form.html" %}
          <button class="btn btn-primary" type="submit">Enregistrer</button>
          <a class="btn btn-outline-secondary" href="{% url 'dashboard' %}">Annuler</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
