{% if page.paginator.num_pages > 1 %}
<nav aria-label="Pagination" class="mt-3">
  <ul class="pagination pagination-sm justify-content-center mb-0">
    {% if page.has_previous %}
      <li class="page-item"><a class="page-link" href="?{% if recherche %}q={{ recherche }}&{% endif %}{% if categorie_selectionnee %}categorie={{ categorie_selectionnee }}&{% endif %}{% if statut_selectionne %}statut={{ statut_selectionne }}&{% endif %}{% if filtre %}etat={{ filtre }}&{% endif %}{% if etat %}etat={{ etat }}&{% endif %}{% if type_selectionne %}type={{ type_selectionne }}&{% endif %}page={{ page.previous_page_number }}">Précédent</a></li>
    {% endif %}
    <li class="page-item disabled"><span class="page-link">Page {{ page.number }} / {{ page.paginator.num_pages }}</span></li>
    {% if page.has_next %}
      <li class="page-item"><a class="page-link" href="?{% if recherche %}q={{ recherche }}&{% endif %}{% if categorie_selectionnee %}categorie={{ categorie_selectionnee }}&{% endif %}{% if statut_selectionne %}statut={{ statut_selectionne }}&{% endif %}{% if filtre %}etat={{ filtre }}&{% endif %}{% if etat %}etat={{ etat }}&{% endif %}{% if type_selectionne %}type={{ type_selectionne }}&{% endif %}page={{ page.next_page_number }}">Suivant</a></li>
    {% endif %}
  </ul>
</nav>
{% endif %}
