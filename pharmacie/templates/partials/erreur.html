<div class="error-page">
  <div class="card error-card">
    <div class="card-body py-5">
      <div class="error-code">{{ code }}</div>
      <div class="error-icon"><i class="bi {{ icone }}"></i></div>
      <h2 class="h4 mb-2">{{ titre }}</h2>
      <p class="text-muted mb-4">{{ message }}</p>
      {% if user.is_authenticated %}
        <a class="btn btn-primary" href="{% url 'dashboard' %}"><i class="bi bi-arrow-left me-1"></i> Retour au tableau de bord</a>
      {% else %}
        <a class="btn btn-primary" href="{% url 'login' %}"><i class="bi bi-box-arrow-in-right me-1"></i> Se connecter</a>
      {% endif %}
    </div>
  </div>
</div>
